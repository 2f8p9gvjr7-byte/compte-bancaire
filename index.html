<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compte Partagé</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0e;
    --surface: #1a1a18;
    --surface2: #242422;
    --border: #2e2e2b;
    --text: #f0ede8;
    --muted: #8a8880;
    --accent-a: #c8b97a;
    --accent-b: #7ab8c8;
    --accent-total: #9fc87a;
    --red: #e07a7a;
    --green: #7ac8a0;
    --radius: 12px;
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    color: var(--text);
    letter-spacing: -1px;
    line-height: 1.1;
  }
  header p {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 6px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── Settings bar ── */
  .settings-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 32px;
  }
  .settings-bar label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .name-group { display: flex; align-items: center; gap: 8px; }
  .name-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    padding: 6px 10px;
    border-radius: 6px;
    width: 80px;
    transition: border-color .2s;
  }
  .name-input:focus { outline: none; border-color: var(--accent-a); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot-a { background: var(--accent-a); }
  .dot-b { background: var(--accent-b); }
  .dot-total { background: var(--accent-total); }

  /* ── 3-column grid ── */
  .cols {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
  }

  /* ── Panel ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .panel-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .panel-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.25rem;
    flex: 1;
  }
  .panel-a .panel-header { border-top: 3px solid var(--accent-a); }
  .panel-b .panel-header { border-top: 3px solid var(--accent-b); }
  .panel-total .panel-header { border-top: 3px solid var(--accent-total); }

  /* ── Balances ── */
  .balances {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .bal-cell {
    background: var(--surface);
    padding: 12px 14px;
    text-align: center;
  }
  .bal-cell label { display: block; color: var(--muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .bal-amount { font-size: 1.05rem; font-weight: 500; }
  .bal-amount.positive { color: var(--green); }
  .bal-amount.negative { color: var(--red); }
  .bal-amount.neutral  { color: var(--text); }

  /* editable solde départ */
  .bal-edit-wrap { position: relative; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .btn-edit-bal {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 0.7rem; padding: 2px 4px;
    border-radius: 4px; transition: color .15s;
  }
  .btn-edit-bal:hover { color: var(--accent-a); }
  .bal-input {
    background: var(--bg); border: 1px solid var(--accent-a);
    color: var(--text); font-family: 'DM Mono', monospace;
    font-size: 0.9rem; padding: 3px 6px; border-radius: 5px;
    width: 90px; text-align: center;
  }
  .bal-input:focus { outline: none; }

  /* ── Total dépenses ── */
  .spending-row {
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .spending-row span:last-child { color: var(--red); font-weight: 500; font-size: 0.85rem; }

  /* ── Add movement ── */
  .add-form {
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .add-form input, .add-form select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 7px 10px;
    border-radius: 7px;
    transition: border-color .2s;
  }
  .add-form input:focus, .add-form select:focus { outline: none; border-color: var(--accent-a); }
  .add-form input[type="text"] { flex: 1; min-width: 100px; }
  .add-form input[type="number"] { width: 90px; }
  .add-form select { width: 110px; }
  .btn-add {
    background: var(--accent-a);
    color: var(--bg);
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 7px;
    cursor: pointer;
    transition: opacity .15s;
    white-space: nowrap;
  }
  .btn-add:hover { opacity: 0.85; }
  .panel-b .btn-add { background: var(--accent-b); }
  .panel-total { opacity: 0.9; }

  /* ── Movements list ── */
  .movements {
    flex: 1;
    overflow-y: auto;
    max-height: 280px;
  }
  .movements::-webkit-scrollbar { width: 4px; }
  .movements::-webkit-scrollbar-track { background: var(--surface); }
  .movements::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .mv-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.78rem;
    transition: background .12s;
  }
  .mv-item:hover { background: var(--surface2); }
  .mv-date { color: var(--muted); width: 72px; flex-shrink: 0; }
  .mv-label { flex: 1; }
  .mv-amount { font-weight: 500; }
  .mv-amount.dep { color: var(--red); }
  .mv-amount.cred { color: var(--green); }
  .mv-type-badge {
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 2px 5px; border-radius: 4px; background: var(--surface2);
    color: var(--muted); flex-shrink: 0;
  }
  .btn-del-mv {
    background: none; border: none; cursor: pointer;
    color: var(--border); font-size: 0.9rem; padding: 2px 4px;
    border-radius: 4px; transition: color .15s;
  }
  .btn-del-mv:hover { color: var(--red); }

  .empty-mv {
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    font-style: italic;
  }

  /* ── Total panel special ── */
  .total-mv-section { display: none; }
  .panel-total .movements { max-height: 320px; }
  .mv-owner-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* ── Actions ── */
  .actions-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
  }
  .actions-section h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    margin-bottom: 16px;
    color: var(--muted);
  }
  .action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
  }
  .btn-action {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.76rem;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-action:hover { border-color: var(--muted); }
  .btn-action.danger { border-color: #4a2020; }
  .btn-action.danger:hover { background: #3a1515; border-color: var(--red); color: var(--red); }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    max-width: 380px;
    width: 90%;
  }
  .modal h3 { font-family: 'DM Serif Display', serif; font-size: 1.2rem; margin-bottom: 10px; }
  .modal p { color: var(--muted); font-size: 0.8rem; margin-bottom: 20px; line-height: 1.6; }
  .modal-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-modal {
    flex: 1;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-modal:hover { border-color: var(--muted); }
  .btn-modal.confirm-danger { background: #3a1515; border-color: var(--red); color: var(--red); }
  .btn-modal.confirm-danger:hover { background: #501a1a; }

  /* responsive */
  @media (max-width: 640px) {
    .balances { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Compte Partagé</h1>
  <p>Suivi des mouvements · Données locales</p>
</header>

<!-- Settings -->
<div class="settings-bar" id="settingsBar">
  <div class="name-group">
    <span class="dot dot-a"></span>
    <label>Nom A :</label>
    <input class="name-input" id="nameA" type="text" maxlength="20" placeholder="Personne A">
  </div>
  <div class="name-group">
    <span class="dot dot-b"></span>
    <label>Nom B :</label>
    <input class="name-input" id="nameB" type="text" maxlength="20" placeholder="Personne B">
  </div>
  <div class="name-group">
    <span class="dot dot-total"></span>
    <label>Total :</label>
    <input class="name-input" id="nameTotal" type="text" maxlength="20" placeholder="Total">
  </div>
</div>

<!-- 3 Panels -->
<div class="cols">
  <!-- Panel A -->
  <div class="panel panel-a" id="panelA">
    <div class="panel-header">
      <span class="dot dot-a"></span>
      <span class="panel-title" id="titleA">Personne A</span>
    </div>
    <div class="balances">
      <div class="bal-cell">
        <label>Solde départ</label>
        <div class="bal-edit-wrap">
          <span class="bal-amount neutral" id="initBalA">0,00 €</span>
          <button class="btn-edit-bal" onclick="startEditBal('A')" title="Modifier">✎</button>
        </div>
      </div>
      <div class="bal-cell">
        <label>Dépenses</label>
        <span class="bal-amount negative" id="spendA">0,00 €</span>
      </div>
      <div class="bal-cell">
        <label>Encours</label>
        <span class="bal-amount" id="finalBalA">0,00 €</span>
      </div>
    </div>
    <div class="add-form" id="formA">
      <input type="text" id="labelA" placeholder="Libellé…">
      <input type="number" id="amountA" placeholder="Montant" step="0.01">
      <select id="typeA">
        <option value="dep">↓ Débit</option>
        <option value="cred">↑ Crédit</option>
      </select>
      <button class="btn-add" onclick="addMovement('A')">+ Ajouter</button>
    </div>
    <div class="movements" id="mvA"></div>
  </div>

  <!-- Panel B -->
  <div class="panel panel-b" id="panelB">
    <div class="panel-header">
      <span class="dot dot-b"></span>
      <span class="panel-title" id="titleB">Personne B</span>
    </div>
    <div class="balances">
      <div class="bal-cell">
        <label>Solde départ</label>
        <div class="bal-edit-wrap">
          <span class="bal-amount neutral" id="initBalB">0,00 €</span>
          <button class="btn-edit-bal" onclick="startEditBal('B')" title="Modifier">✎</button>
        </div>
      </div>
      <div class="bal-cell">
        <label>Dépenses</label>
        <span class="bal-amount negative" id="spendB">0,00 €</span>
      </div>
      <div class="bal-cell">
        <label>Encours</label>
        <span class="bal-amount" id="finalBalB">0,00 €</span>
      </div>
    </div>
    <div class="add-form" id="formB">
      <input type="text" id="labelB" placeholder="Libellé…">
      <input type="number" id="amountB" placeholder="Montant" step="0.01">
      <select id="typeB">
        <option value="dep">↓ Débit</option>
        <option value="cred">↑ Crédit</option>
      </select>
      <button class="btn-add" onclick="addMovement('B')">+ Ajouter</button>
    </div>
    <div class="movements" id="mvB"></div>
  </div>

  <!-- Panel Total -->
  <div class="panel panel-total" id="panelTotal">
    <div class="panel-header">
      <span class="dot dot-total"></span>
      <span class="panel-title" id="titleTotal">Total</span>
    </div>
    <div class="balances">
      <div class="bal-cell">
        <label>Solde départ</label>
        <span class="bal-amount neutral" id="initBalTotal">0,00 €</span>
      </div>
      <div class="bal-cell">
        <label>Dépenses</label>
        <span class="bal-amount negative" id="spendTotal">0,00 €</span>
      </div>
      <div class="bal-cell">
        <label>Encours</label>
        <span class="bal-amount" id="finalBalTotal">0,00 €</span>
      </div>
    </div>
    <div class="movements" id="mvTotal"></div>
  </div>
</div>

<!-- Actions -->
<div class="actions-section">
  <h3>⚙ Gestion des données</h3>
  <div class="action-row">
    <button class="btn-action" onclick="openModal('movements')">🗑 Effacer les mouvements uniquement</button>
    <button class="btn-action" onclick="openModal('balances')">✏ Réinitialiser les soldes uniquement</button>
    <button class="btn-action danger" onclick="openModal('all')">⚠ Tout effacer (mouvements + soldes)</button>
  </div>
  <div class="action-row">
    <button class="btn-action" onclick="openModal('movA')">Effacer mouvements de <span id="lbl-mvA">A</span></button>
    <button class="btn-action" onclick="openModal('movB')">Effacer mouvements de <span id="lbl-mvB">B</span></button>
    <button class="btn-action" onclick="openModal('balA')">Modifier solde départ de <span id="lbl-balA">A</span></button>
    <button class="btn-action" onclick="openModal('balB')">Modifier solde départ de <span id="lbl-balB">B</span></button>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Confirmer</h3>
    <p id="modalDesc"></p>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>

<script>
// ── State ──
const LS = 'compte_partage_v1';

function loadState() {
  try {
    const raw = localStorage.getItem(LS);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {
    names: { A: 'Personne A', B: 'Personne B', Total: 'Total' },
    balances: { A: 0, B: 0 },
    movements: { A: [], B: [] }
  };
}

function saveState(s) {
  localStorage.setItem(LS, JSON.stringify(s));
}

let state = loadState();

// ── Helpers ──
function fmt(n) {
  return n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}
function today() {
  return new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}

// ── Render ──
function render() {
  // Names
  document.getElementById('nameA').value = state.names.A;
  document.getElementById('nameB').value = state.names.B;
  document.getElementById('nameTotal').value = state.names.Total;
  ['A','B','Total'].forEach(k => {
    const el = document.getElementById('title'+k);
    if (el) el.textContent = state.names[k];
  });
  document.getElementById('lbl-mvA').textContent = state.names.A;
  document.getElementById('lbl-mvB').textContent = state.names.B;
  document.getElementById('lbl-balA').textContent = state.names.A;
  document.getElementById('lbl-balB').textContent = state.names.B;

  // Balances A
  const spendA = state.movements.A.filter(m => m.type !== 'cred').reduce((s,m) => s + m.amount, 0);
  const creditA = state.movements.A.filter(m => m.type === 'cred').reduce((s,m) => s + m.amount, 0);
  const finalA = state.balances.A - spendA + creditA;
  document.getElementById('initBalA').textContent = fmt(state.balances.A);
  document.getElementById('spendA').textContent = '-' + fmt(spendA);
  const felA = document.getElementById('finalBalA');
  felA.textContent = fmt(finalA);
  felA.className = 'bal-amount ' + (finalA >= 0 ? 'positive' : 'negative');

  // Balances B
  const spendB = state.movements.B.filter(m => m.type !== 'cred').reduce((s,m) => s + m.amount, 0);
  const creditB = state.movements.B.filter(m => m.type === 'cred').reduce((s,m) => s + m.amount, 0);
  const finalB = state.balances.B - spendB + creditB;
  document.getElementById('initBalB').textContent = fmt(state.balances.B);
  document.getElementById('spendB').textContent = '-' + fmt(spendB);
  const felB = document.getElementById('finalBalB');
  felB.textContent = fmt(finalB);
  felB.className = 'bal-amount ' + (finalB >= 0 ? 'positive' : 'negative');

  // Totals
  const initTotal = state.balances.A + state.balances.B;
  const spendTotal = spendA + spendB;
  const finalTotal = finalA + finalB;
  document.getElementById('initBalTotal').textContent = fmt(initTotal);
  document.getElementById('spendTotal').textContent = '-' + fmt(spendTotal);
  const felT = document.getElementById('finalBalTotal');
  felT.textContent = fmt(finalTotal);
  felT.className = 'bal-amount ' + (finalTotal >= 0 ? 'positive' : 'negative');

  // Movements A
  renderMvList('mvA', state.movements.A, null);
  renderMvList('mvB', state.movements.B, null);

  // Combined total list
  const combined = [
    ...state.movements.A.map(m => ({...m, owner: 'A'})),
    ...state.movements.B.map(m => ({...m, owner: 'B'}))
  ].sort((a,b) => b.id - a.id);
  renderMvList('mvTotal', combined, true);
}

function renderMvList(containerId, items, showOwner) {
  const el = document.getElementById(containerId);
  if (!items.length) {
    el.innerHTML = '<div class="empty-mv">Aucun mouvement</div>';
    return;
  }
  el.innerHTML = items.map(m => {
    const ownerDot = showOwner
      ? `<span class="mv-owner-dot" style="background:var(--accent-${m.owner.toLowerCase()})"></span>`
      : '';
    const sign = m.type === 'cred' ? '+' : '-';
    const typeLabel = m.type === 'dep' ? 'débit' : 'crédit';
    const owner = showOwner ? m.owner : (containerId === 'mvA' ? 'A' : 'B');
    return `
      <div class="mv-item">
        ${ownerDot}
        <span class="mv-date">${m.date}</span>
        <span class="mv-label">${m.label}</span>
        <span class="mv-type-badge">${typeLabel}</span>
        <span class="mv-amount ${m.type}">${sign}${fmt(m.amount)}</span>
        <button class="btn-del-mv" onclick="delMovement('${owner}',${m.id})" title="Supprimer">✕</button>
      </div>`;
  }).join('');
}

// ── Add movement ──
function addMovement(who) {
  const label = document.getElementById('label'+who).value.trim();
  const amount = parseFloat(document.getElementById('amount'+who).value);
  const type = document.getElementById('type'+who).value;
  if (!label || isNaN(amount) || amount <= 0) {
    alert('Veuillez saisir un libellé et un montant valide.');
    return;
  }
  state.movements[who].unshift({ id: Date.now(), date: today(), label, amount, type });
  saveState(state);
  document.getElementById('label'+who).value = '';
  document.getElementById('amount'+who).value = '';
  render();
}

// ── Delete single movement ──
function delMovement(who, id) {
  state.movements[who] = state.movements[who].filter(m => m.id !== id);
  saveState(state);
  render();
}

// ── Edit balance ──
function startEditBal(who) {
  const cell = document.getElementById('initBal'+who).parentElement;
  const cur = state.balances[who];
  cell.innerHTML = `
    <input class="bal-input" id="editBal${who}" type="number" value="${cur}" step="0.01">
    <button class="btn-edit-bal" onclick="saveBal('${who}')" title="Valider">✔</button>
    <button class="btn-edit-bal" onclick="render()" title="Annuler">✕</button>
  `;
  document.getElementById('editBal'+who).focus();
}
function saveBal(who) {
  const val = parseFloat(document.getElementById('editBal'+who).value);
  if (!isNaN(val)) {
    state.balances[who] = val;
    saveState(state);
  }
  render();
}

// ── Names ──
['A','B','Total'].forEach(k => {
  document.getElementById('name'+k).addEventListener('input', function() {
    state.names[k] = this.value || k;
    saveState(state);
    render();
  });
});

// ── Modal system ──
let modalAction = null;

const modalConfigs = {
  movements: {
    title: '🗑 Effacer tous les mouvements',
    desc: 'Les mouvements de A et B seront supprimés. Les soldes de départ sont conservés.',
    btns: [
      { label: 'Annuler', cls: '', action: 'close' },
      { label: 'Confirmer', cls: 'confirm-danger', action: 'doMovements' }
    ]
  },
  balances: {
    title: '✏ Réinitialiser les soldes',
    desc: 'Les soldes de départ de A et B seront remis à 0. Les mouvements sont conservés.',
    btns: [
      { label: 'Annuler', cls: '', action: 'close' },
      { label: 'Confirmer', cls: 'confirm-danger', action: 'doBalances' }
    ]
  },
  all: {
    title: '⚠ Tout effacer',
    desc: 'Tous les mouvements ET les soldes de départ seront supprimés. Cette action est irréversible.',
    btns: [
      { label: 'Annuler', cls: '', action: 'close' },
      { label: 'Tout effacer', cls: 'confirm-danger', action: 'doAll' }
    ]
  },
  movA: {
    title: () => `Effacer mouvements de ${state.names.A}`,
    desc: () => `Tous les mouvements de ${state.names.A} seront supprimés.`,
    btns: [
      { label: 'Annuler', cls: '', action: 'close' },
      { label: 'Confirmer', cls: 'confirm-danger', action: 'doMovA' }
    ]
  },
  movB: {
    title: () => `Effacer mouvements de ${state.names.B}`,
    desc: () => `Tous les mouvements de ${state.names.B} seront supprimés.`,
    btns: [
      { label: 'Annuler', cls: '', action: 'close' },
      { label: 'Confirmer', cls: 'confirm-danger', action: 'doMovB' }
    ]
  },
  balA: {
    title: () => `Modifier solde de ${state.names.A}`,
    desc: () => `Saisissez le nouveau solde de départ pour ${state.names.A}.`,
    btns: [
      { label: 'Annuler', cls: '', action: 'close' },
      { label: 'Enregistrer', cls: 'confirm-danger', action: 'doBalA' }
    ],
    input: true, who: 'A'
  },
  balB: {
    title: () => `Modifier solde de ${state.names.B}`,
    desc: () => `Saisissez le nouveau solde de départ pour ${state.names.B}.`,
    btns: [
      { label: 'Annuler', cls: '', action: 'close' },
      { label: 'Enregistrer', cls: 'confirm-danger', action: 'doBalB' }
    ],
    input: true, who: 'B'
  }
};

function openModal(type) {
  const cfg = modalConfigs[type];
  modalAction = type;
  document.getElementById('modalTitle').textContent = typeof cfg.title === 'function' ? cfg.title() : cfg.title;
  let descHtml = typeof cfg.desc === 'function' ? cfg.desc() : cfg.desc;
  if (cfg.input) {
    const cur = state.balances[cfg.who];
    descHtml += `<br><br><input id="modalInput" type="number" class="bal-input" value="${cur}" step="0.01" style="width:120px;margin-top:4px;">`;
  }
  document.getElementById('modalDesc').innerHTML = descHtml;
  document.getElementById('modalBtns').innerHTML = cfg.btns.map(b =>
    `<button class="btn-modal ${b.cls}" onclick="handleModal('${b.action}')">${b.label}</button>`
  ).join('');
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function handleModal(action) {
  switch(action) {
    case 'close': break;
    case 'doMovements':
      state.movements.A = []; state.movements.B = []; saveState(state); break;
    case 'doBalances':
      state.balances.A = 0; state.balances.B = 0; saveState(state); break;
    case 'doAll':
      state.movements.A = []; state.movements.B = [];
      state.balances.A = 0; state.balances.B = 0; saveState(state); break;
    case 'doMovA': state.movements.A = []; saveState(state); break;
    case 'doMovB': state.movements.B = []; saveState(state); break;
    case 'doBalA': {
      const v = parseFloat(document.getElementById('modalInput')?.value);
      if (!isNaN(v)) { state.balances.A = v; saveState(state); }
      break;
    }
    case 'doBalB': {
      const v = parseFloat(document.getElementById('modalInput')?.value);
      if (!isNaN(v)) { state.balances.B = v; saveState(state); }
      break;
    }
  }
  document.getElementById('modalOverlay').classList.add('hidden');
  render();
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) handleModal('close');
});

// ── Init ──
render();
</script>
</body>
</html>
